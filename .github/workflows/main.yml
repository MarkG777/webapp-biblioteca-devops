name: CI/CD - Build, Test y Publicar Imagen

on:
  push:
    branches: [main]
    paths:
      - "app.py"
      - "socket_server.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pytest.ini"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - ".github/workflows/main.yml"
  pull_request:
    branches: [main]
    paths:
      - "app.py"
      - "socket_server.py"
      - "requirements.txt"
      - "requirements-dev.txt"
      - "pytest.ini"
      - "Dockerfile"
      - "package.json"
      - "package-lock.json"
      - "tests/**"
      - ".github/workflows/main.yml"
  workflow_dispatch: {}

jobs:
  build-test-push:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Instalar dependencias de Python
        run: pip install -r requirements-dev.txt

      - name: Correr pruebas con pytest y cobertura (minimo 70%)
        run: python -m pytest --cov=app --cov=socket_server --cov-report=term-missing --cov-fail-under=70

      - name: Construir la imagen
        run: docker build -t webapp:ci .

      - name: Levantar el contenedor para pruebas
        run: docker run -d -p 8080:80 -p 6061:6061 --name webapp-ci webapp:ci

      - name: Esperar a que el servicio responda
        run: |
          for i in $(seq 1 15); do
            curl -sf http://localhost:8080/ && exit 0
            sleep 2
          done
          echo "El servicio nunca respondio" >&2
          exit 1

      - name: Preparar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Instalar dependencias de Jest
        run: npm ci

      - name: Correr pruebas con Jest (HTTP + socket TCP)
        run: npx jest --runInBand

      - name: Logs del contenedor (por si algo falla)
        if: failure()
        run: docker logs webapp-ci

      - name: Apagar el contenedor de pruebas
        if: always()
        run: docker rm -f webapp-ci

      - name: Iniciar sesion en Docker Hub
        if: success() && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Etiquetar y publicar en Docker Hub
        if: success() && github.event_name == 'push'
        run: |
          docker tag webapp:ci ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
          docker tag webapp:ci ${{ secrets.DOCKERHUB_USERNAME }}/webapp:${{ github.sha }}
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
          docker push ${{ secrets.DOCKERHUB_USERNAME }}/webapp:${{ github.sha }}

  deploy:
    needs: build-test-push
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Desplegar en EC2 por SSH
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
          EC2_SSH_KEY: ${{ secrets.EC2_SSH_KEY }}
          IMAGEN: ${{ secrets.DOCKERHUB_USERNAME }}/webapp:latest
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$EC2_SSH_KEY" > ~/.ssh/ec2.pem
          chmod 600 ~/.ssh/ec2.pem
          ssh-keyscan -H "$EC2_HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/ec2.pem "ubuntu@$EC2_HOST" \
            "docker pull $IMAGEN && (docker rm -f webapp-container || true) && docker run -d --restart unless-stopped --name webapp-container -p 80:80 -p 6061:6061 $IMAGEN"

      - name: Esperar a que la API responda en el puerto 80
        env:
          EC2_HOST: ${{ secrets.EC2_HOST }}
        run: |
          for i in $(seq 1 15); do
            curl -sf "http://$EC2_HOST/api/autores" && exit 0
            sleep 3
          done
          echo "La API no respondio en el puerto 80" >&2
          exit 1
